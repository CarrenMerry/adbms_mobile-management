<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Mobile Sales & Inventory Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px -10px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
                <i class="bi bi-phone"></i>
            </div>
            <h4 class="fw-bold mb-1">SmartMobile System</h4>
            <p class="text-muted-custom small mb-0">Sales & Inventory Management System</p>
            <span class="badge bg-light text-success border border-success-subtle mt-2">MCA ADBMS Project</span>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="emailInput" class="form-label fw-semibold small">Admin Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0" id="emailInput" value="admin@mobileshop.com" required placeholder="admin@mobileshop.com">
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between">
                    <label for="passwordInput" class="form-label fw-semibold small">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="passwordInput" value="admin123" required placeholder="••••••••">
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                    <label class="form-check-label small text-muted-custom" for="rememberMe">
                        Remember me
                    </label>
                </div>
                <button type="button" class="btn btn-link p-0 text-success text-decoration-none small" id="autoFillBtn">
                    Demo Autofill
                </button>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2" id="loginSubmitBtn">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <small class="text-muted d-block">Database: MySQL 8.0 &bull; Relational Schema: 5 Tables</small>
            <small class="text-muted-custom font-monospace" style="font-size: 0.72rem;">CUSTOMER &bull; EMPLOYEE &bull; PRODUCT &bull; SALES_ORDER &bull; ORDER_ITEM</small>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
    document.getElementById('autoFillBtn').addEventListener('click', () => {
        document.getElementById('emailInput').value = 'admin@mobileshop.com';
        document.getElementById('passwordInput').value = 'admin123';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('loginSubmitBtn');
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

        try {
            const res = await api.post('/auth/login', { email, password });
            if (res.success) {
                localStorage.setItem('smart_mobile_user', JSON.stringify(res.user));
                showToast('Welcome back, ' + res.user.name + '!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 400);
            }
        } catch (err) {
            showToast(err.message, 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard';
        }
    });
</script>
</body>
</html>
